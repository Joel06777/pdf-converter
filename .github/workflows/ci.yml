name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Tesseract y OCRmyPDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng ocrmypdf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Generar fixtures de prueba
        run: python scripts/generate_fixtures.py
      - name: Pruebas
        run: python -m pytest -q
      - name: Verificar que no hay secretos en el código
        run: |
          grep -RInE "(sk-|AKIA|BEGIN (RSA|OPENSSH|PRIVATE KEY))" app/ scripts/ tests/ || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen Docker
        run: docker build -t pdf-converter:ci .
      - name: Arrancar la API y comprobar /health
        run: |
          docker run -d --name api -p 8000:8000 -e REDIS_URL= -e STORAGE_DIR=/data/jobs pdf-converter:ci
          sleep 8
          curl -f http://localhost:8000/health
