# Para escalar conversiones: docker compose up -d --scale worker=8
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["jobs:/data/jobs"]
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    env_file: .env
    volumes: ["jobs:/data/jobs"]
    depends_on: [redis]
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 2g}

  beat:
    build: .
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: .env
    volumes: ["jobs:/data/jobs"]
    depends_on: [redis]
    restart: unless-stopped

volumes:
  jobs:
